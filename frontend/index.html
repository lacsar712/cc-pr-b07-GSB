<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>印刷套准复核台</title>
    <style>
      body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { padding: 12px 20px; }
      .topbar { display: flex; align-items: center; gap: 14px; background: #243044; color: #fff; padding: 8px 16px; }
      .topbar nav { display: flex; gap: 6px; }
      .topbar button { background: transparent; color: #cbd5e1; border: 1px solid #475569; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
      .topbar button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
      .topbar .spacer { flex: 1; }
      .banner { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 4px; padding: 8px 12px; }
      table { border-collapse: collapse; margin-top: 10px; }
      th, td { border: 1px solid #d1d5db; padding: 4px 12px; }
      input { margin: 0 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
